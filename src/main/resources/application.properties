# Server Configuration
server.port=8087
spring.application.name=eventsphere-backend

# AWS S3 Configuration
# Credentials are NOT stored here. They are read dynamically from environment variables
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION) via the AWS SDK Default Credentials Provider Chain.
app.s3.bucket-name=s3-test-01-navaneeth
app.s3.folder=eventsphere
app.s3.region=us-east-1

# CORS Configuration - Allowed Frontend Origins
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
